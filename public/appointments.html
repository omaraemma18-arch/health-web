<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Appointment - Omara Health Services</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Omara Health Services</h1>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/services.html">Services</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
        <a href="/appointments.html">Book</a>
      </nav>
    </div>
  </header>

  <main class="container contact-page">
    <h2>Book an Appointment</h2>

    <form id="appointmentForm" class="contact-form">
      <label>
        Name
        <input type="text" name="name" required>
      </label>
      <label>
        Email
        <input type="email" name="email" required>
      </label>
      <label>
        Preferred Date
        <input type="date" name="preferredDate">
      </label>
      <label>
        Service
        <select name="service">
          <option>Primary Care</option>
          <option>Pediatrics</option>
          <option>Women's Health</option>
          <option>Telemedicine</option>
        </select>
      </label>
      <label>
        Notes
        <textarea name="message" rows="4"></textarea>
      </label>
      <button type="submit" class="btn">Request Appointment</button>
      <p id="appointmentStatus" class="form-status"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Omara Health Services</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
